{% extends "base.html" %}
{% block title %}Registros · Admin{% endblock %}

{% block extra_head %}
  <!-- Tabulator CSS (tema Bootstrap 5) -->
  <link href="https://unpkg.com/tabulator-tables@6.3.0/dist/css/tabulator_bootstrap5.min.css" rel="stylesheet">
  <style>
    .tabulator-row .btn-sm { padding: .15rem .4rem; }
    .tabulator-responsive-collapse { background:#fafafa; }
    .sticky-toolbar {
      position: sticky; top: .5rem; z-index: 5; background: var(--bs-body-bg);
      border: 1px solid var(--bs-border-color); border-radius: .5rem; padding: .5rem;
    }
  </style>
{% endblock %}

{% block content %}
<div class="container-xxl">
  <div class="d-flex align-items-center justify-content-between mb-3">
    <h3 class="mb-0"><i class="bi bi-table me-2"></i>Registros</h3>
    <div class="d-flex gap-2">
      <a href="{{ url_for('admin.logout') }}" class="btn btn-outline-secondary btn-sm">
        <i class="bi bi-box-arrow-right"></i> Salir
      </a>
    </div>
  </div>

  <!-- Filtros -->
  <div class="row g-2 mb-3 sticky-toolbar">
    <div class="col-12 col-md-3">
      <label class="form-label">Banco</label>
      <select id="f_banco" class="form-select">
        <option value="">Todos</option>
        <option>BBVA</option>
        <option>Banorte</option>
        <option>Azteca</option>
        <option>Scotiabank</option>
        <option>Santander</option>
      </select>
    </div>
    <div class="col-6 col-md-3">
      <label class="form-label">Forma de pago</label>
      <select id="f_forma" class="form-select">
        <option value="">Todas</option>
        <option value="Deposito">Deposito</option>
        <option value="Transferencia">Transferencia</option>
      </select>
    </div>
    <div class="col-6 col-md-3">
      <label class="form-label"># Usuario</label>
      <input id="f_usuario" class="form-control" inputmode="numeric" placeholder="12345">
    </div>
    <div class="col-12 col-md-3 d-flex align-items-end gap-2">
      <button id="btnBuscar" class="btn btn-primary w-100">
        <i class="bi bi-search"></i> Buscar
      </button>
      <div class="dropdown">
        <button class="btn btn-outline-secondary" data-bs-toggle="dropdown"><i class="bi bi-download"></i></button>
        <ul class="dropdown-menu dropdown-menu-end">
          <li><a class="dropdown-item" href="#" id="dlCsv">CSV</a></li>
          <li><a class="dropdown-item" href="#" id="dlXlsx">XLSX</a></li>
        </ul>
      </div>
    </div>
  </div>

  <!-- Grid -->
  <div id="depositosGrid" class="card"></div>
</div>
{% endblock %}

{% block body_extra %}
  <!-- Tabulator JS -->
  <script src="https://unpkg.com/tabulator-tables@6.3.0/dist/js/tabulator.min.js"></script>
  <!-- XLSX export helper -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <script>
  // Helpers de red
  async function patchCell(id, field, value) {
    const resp = await fetch(`/admin/api/depositos/${id}`, {
      method: 'PATCH',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ field, value })
    });
    if (!resp.ok) {
      const data = await resp.json().catch(()=>({error:'Error desconocido'}));
      throw new Error(data.error || 'No se pudo guardar');
    }
    return resp.json();
  }
  async function deleteRow(id) {
    const resp = await fetch(`/admin/api/depositos/${id}`, { method:'DELETE' });
    if (!resp.ok && resp.status !== 204) {
      const data = await resp.json().catch(()=>({error:'Error desconocido'}));
      throw new Error(data.error || 'No se pudo eliminar');
    }
  }

  // Formateadores
  function moneyFormatter(cell) {
    const v = cell.getValue();
    const num = Number(v || 0);
    return num.toLocaleString('es-MX', { style: 'currency', currency: 'MXN' });
  }

  // Columnas (tipo Excel)
  const columns = [
    { title:"#", field:"id", width:70, hozAlign:"center", headerSort:false, frozen:true },
    { title:"Fecha", field:"fecha_operacion", editor:"input", validator:["required"],
      headerHozAlign:"center", width:130, responsive:0,
      mutatorEdit:function(value){ return value || ""; },
      // Acepta ISO (yyyy-mm-dd)
    },
    { title:"Banco", field:"banco", width:130, editor:"select",
      editorParams:{ values:["BBVA","Banorte","Azteca","Scotiabank","Santander"] }, responsive:0 },
    { title:"Forma", field:"forma_pago", width:140, editor:"select",
      editorParams:{ values:["Deposito","Transferencia"] }, responsive:0 },
    { title:"Producto", field:"producto", width:150, editor:"select",
      editorParams:{ values:["TAE","Pago de servicios"] }, responsive:0 },
    { title:"Usuario", field:"numero_usuario", width:120, editor:"input",
      validator:["required","integer","minLength:5","maxLength:5"], responsive:0 },
    { title:"Importe", field:"importe", width:140, hozAlign:"right", formatter:moneyFormatter,
      editor:"input", validator:["required"], responsive:0,
      mutatorEdit:function(v){ return (v+"").replace(",","."); } },

    { title:"BBVA tipo", field:"bbva_tipo", width:130, editor:"select",
      editorParams:{ values:["","practicaja","caja"] }, responsive:2 },

    { title:"Folio", field:"folio", width:130, editor:"input", responsive:1 },
    { title:"Autorización", field:"autorizacion", width:130, editor:"input", responsive:2 },
    { title:"Referencia", field:"referencia", width:160, editor:"input", responsive:1 },

    { title:"Factura", field:"requiere_factura", width:100, hozAlign:"center",
      formatter:"tickCross", editor:true, responsive:1 },

    { title:"Estatus", field:"estatus", width:140, editor:"select",
      editorParams:{ values:["registrado","validado","rechazado","facturado"] }, responsive:1 },

    { title:"Observaciones", field:"observaciones", width:240, editor:"textarea", responsive:3 },

    // Extras visibles (read-only)
    { title:"Razón social", field:"factura_titulo", width:220, headerTooltip:"Opción fiscal asignada", responsive:3 },
    { title:"RFC", field:"factura_rfc", width:140, responsive:4 },
    { title:"Email fiscal", field:"factura_email", width:220, responsive:4 },

    // Acciones
    { title:"Comprobante", field:"comprobante_id", width:140, headerSort:false, hozAlign:"center", responsive:0,
      formatter:function(cell){
        const id = cell.getValue();
        if (!id) return "";
        return `<a class="btn btn-sm btn-outline-primary" href="/admin/comprobante/${id}/ver" target="_blank">
                  <i class="bi bi-file-earmark-text"></i> Ver
                </a>`;
      }
    },
    { title:"", width:80, headerSort:false, hozAlign:"center", frozen:true,
      formatter:function(){
        return `<button class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>`;
      },
      cellClick: async (e, cell) => {
        const row = cell.getRow();
        const data = row.getData();
        if (!confirm(`¿Eliminar registro #${data.id}?`)) return;
        try {
          await deleteRow(data.id);
          row.delete();
        } catch (err) {
          alert(err.message || "Error al eliminar");
        }
      }
    },
  ];

  // Instancia Tabulator
  const table = new Tabulator("#depositosGrid", {
    layout:"fitDataStretch",           // ajusta columnas al contenedor
    responsiveLayout:"collapse",       // colapsa columnas en móviles
    reactiveData:false,
    height:"70vh",
    placeholder:"Sin datos para mostrar",
    index:"id",
    columns,
    ajaxURL:"/admin/api/depositos",
    ajaxConfig:"GET",
    ajaxContentType:"json",
    ajaxParams:{},
    pagination:true,
    paginationSize:50,
    paginationSizeSelector:[25,50,100,200],
    columnDefaults:{
      headerFilter:false,
      tooltip:true,
      headerSort:true,
      resizable:true,
    },
    // detalle responsive
    responsiveLayoutCollapseFormatter:function(data){
      const omit = ["id"];
      const rows = [];
      for (const [k,v] of Object.entries(data)) {
        if (omit.includes(k) || v===null || v===undefined || v==="") continue;
        rows.push(`<div class="d-flex justify-content-between"><span class="text-secondary">${k}</span><span class="fw-semibold">${v}</span></div>`);
      }
      return rows.join("");
    },
    cellEdited: async function(cell){
      const field = cell.getField();
      const row = cell.getRow().getData();
      const value = row[field];
      try {
        const updated = await patchCell(row.id, field, value);
        cell.getRow().update(updated); // sincroniza extras (razón social, etc.)
      } catch (err) {
        alert(err.message || "No se pudo guardar");
        cell.restoreOldValue();
      }
    },
  });

  // Filtros (recarga por servidor para no traer todo)
  async function reload() {
    const banco = document.getElementById('f_banco').value || "";
    const forma = document.getElementById('f_forma').value || "";
    const usuario = document.getElementById('f_usuario').value || "";
    table.setData("/admin/api/depositos", { banco, forma_pago: forma, numero_usuario: usuario });
  }
  document.getElementById('btnBuscar').addEventListener('click', reload);

  // Export
  document.getElementById('dlCsv').addEventListener('click', (e)=>{
    e.preventDefault();
    table.download("csv", "depositos.csv");
  });
  document.getElementById('dlXlsx').addEventListener('click', (e)=>{
    e.preventDefault();
    // usa el polyfill XLSX incluido
    table.download("xlsx", "depositos.xlsx", { sheetName:"Registros" });
  });

  // Carga inicial
  reload();
  </script>
{% endblock %}
